apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: house-management
  namespace: house-management
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  rules:
    - host: house-management.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: house-management
                port:
                  number: 80
